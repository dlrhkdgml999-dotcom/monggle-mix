<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfeeff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>몽글믹스</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="bars"></div>
<div id="fx"></div>

<div id="title">
  <div class="logo">
    <h1>몽글<span>믹스</span></h1>
    <p>둘이서 섞고, 모으고, 색을 되찾는 동화 섬</p>
  </div>
  <div id="pinBox" class="box">
    <button id="resumeBtn" class="btn big hidden"></button>
    <div id="who">비밀번호 4자리를 눌러 주세요</div>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <span></span><button>0</button><button data-k="del">⌫</button>
    </div>
    <small id="loginState"></small>
    <button id="guestBtn" class="link">비밀번호 없이 구경하기</button>
  </div>
</div>
</div>

<div id="hud" class="hidden"></div>
<div id="rotate"><div>📱↻<p>폰을 <b>가로</b>로 돌려 주세요</p></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
